name: Build Android Kivy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache de dependências do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Instalar dependências do sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            ccache \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0.0" virtualenv

      - name: Compilar APK com o Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Salvar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-agronomica-apk
          path: bin/*.apk
