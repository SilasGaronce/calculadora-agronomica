name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Required for Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK and Licenses
        uses: android-actions/setup-android@v3

      - name: Install Buildozer and Linux Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0"
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev bzip2 lld libjpeg-dev libwebp-dev

      - name: Deep Clean Buildozer Cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer/

      - name: Compile APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-agronomica-apk
          path: bin/*.apk
