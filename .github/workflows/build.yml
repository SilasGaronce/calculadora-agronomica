name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev openjdk-17-jdk

      - name: Setup Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n2446a3e67d83e26163d646e148db4de23a71350d\n28a00b5433d941bc4d97e88ffc73dbca68f6bdf1" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Compile APK with Buildozer
        run: |
          buildozer -v android debug
